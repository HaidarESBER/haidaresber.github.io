<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Haidar Esber — Fullstack Developer & Cybersecurity Researcher. An interactive 3D room portfolio." />
  <meta name="author" content="Haidar Esber" />
  <meta name="theme-color" content="#0a0c12" />
  <meta property="og:title" content="Haidar Esber — Interactive 3D Portfolio" />
  <meta property="og:description" content="Fullstack developer & cybersecurity researcher. Explore my work inside an interactive 3D room." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og.png" />
  <title>Haidar Esber — 3D Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- WEBGL -->
  <canvas class="webgl" id="webgl"></canvas>

  <!-- LOADING -->
  <div class="loader" id="loader">
    <div class="loader__inner">
      <div class="loader__name">HAIDAR ESBER</div>
      <div class="loader__sub">Fullstack Developer · Researcher</div>
      <div class="loader__term" id="loaderTerm" aria-hidden="true"></div>
      <div class="loader__bar"><span id="loaderFill"></span></div>
      <div class="loader__count"><span id="loaderPct">0</span>%</div>
    </div>
  </div>

  <!-- LANDING SITE (rendered by JS; the 3D room shows through behind the hero) -->
  <div class="site" id="site"></div>

  <!-- TOP BAR (room mode) -->
  <header class="hud hud--top" id="hud">
    <div class="hud__left">
      <a class="hud__logo" href="#" id="hudLogo" data-cursor>HE<span>.</span></a>
      <button class="hud__exit" id="exitRoom" data-cursor>← <span data-i18n="site.backToSite">site</span></button>
    </div>
    <nav class="hud__nav" id="hudNav">
      <button data-target="laptop"     data-i18n="nav.about"    data-cursor>À propos</button>
      <button data-target="monitors"   data-i18n="nav.work"     data-cursor>Projets</button>
      <button data-target="whiteboard" data-i18n="nav.research" data-cursor>Recherche</button>
      <button data-target="certs"      data-i18n="nav.certs"    data-cursor>Certifs</button>
      <button data-target="contact"    data-i18n="nav.contact"  data-cursor>Contact</button>
    </nav>
    <div class="hud__right">
      <span class="hud__status"><i></i><span data-i18n="statusShort">dispo · sept. 2026</span></span>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="fr" class="active" data-cursor>FR</button><span>/</span><button data-lang="en" data-cursor>EN</button>
      </div>
      <button class="hud__sound" id="soundBtn" title="sound" data-cursor>♪</button>
    </div>
  </header>

  <!-- HINT -->
  <div class="hint" id="hint">
    <span class="hint__icon">⟲</span>
    <span data-i18n="hint.text">Glissez pour explorer · cliquez les objets</span>
  </div>

  <!-- HOVER TOOLTIP -->
  <div class="tip" id="tip"></div>

  <!-- BACK BUTTON -->
  <button class="back-btn" id="backBtn" data-cursor>
    <span>←</span> <span data-i18n="panel.back">Retour</span>
  </button>

  <!-- INFO PANEL -->
  <aside class="panel" id="panel">
    <button class="panel__close" id="panelClose" aria-label="close" data-cursor>×</button>
    <div class="panel__scroll" id="panelBody"></div>
  </aside>

  <!-- MOBILE DOCK -->
  <nav class="dock" id="dock">
    <button data-target="laptop"     data-cursor><span class="dock__ic">◆</span><span data-i18n="nav.about">À propos</span></button>
    <button data-target="monitors"   data-cursor><span class="dock__ic">▣</span><span data-i18n="nav.work">Projets</span></button>
    <button data-target="whiteboard" data-cursor><span class="dock__ic">∿</span><span data-i18n="nav.research">Recherche</span></button>
    <button data-target="certs"      data-cursor><span class="dock__ic">✦</span><span data-i18n="nav.certs">Certifs</span></button>
    <button data-target="contact"    data-cursor><span class="dock__ic">✉</span><span data-i18n="nav.contact">Contact</span></button>
  </nav>

  <!-- ARCADE GAME OVERLAY -->
  <div class="arcade" id="arcadeGame">
    <div class="arcade__cab">
      <div class="arcade__title">HAIDAR · INVADERS</div>
      <div class="arcade__screen" id="arcadeMount"></div>
      <div class="arcade__hint" data-i18n="arcade.hint">← → bouger · ESPACE tirer · ÉCHAP quitter</div>
      <div class="arcade__pad">
        <button id="agLeft" class="arcade__btn" aria-label="left">◀</button>
        <button id="agFire" class="arcade__btn arcade__btn--fire" aria-label="fire">FIRE</button>
        <button id="agRight" class="arcade__btn" aria-label="right">▶</button>
      </div>
    </div>
  </div>

  <!-- MINI-HAIDAR CHAT -->
  <div class="chat" id="chatWin" role="dialog" aria-label="Chat">
    <div class="chat__bar">
      <span class="chat__ava" aria-hidden="true"></span>
      <div class="chat__id"><strong id="chatTitle">mini-haidar</strong><span id="chatStatus">en ligne</span></div>
      <button class="chat__close" id="chatClose" aria-label="close" data-cursor>×</button>
    </div>
    <div class="chat__out" id="chatOut"></div>
    <div class="chat__chips" id="chatChips"></div>
    <div class="chat__in">
      <input id="chatInput" spellcheck="false" autocomplete="off" aria-label="Message" />
      <button id="chatSend" aria-label="send" data-cursor>→</button>
    </div>
  </div>

  <!-- TERMINAL EASTER EGG -->
  <button class="term-launch" id="termLaunch" aria-expanded="false" aria-label="Terminal" data-cursor>&gt;_ <span data-i18n="terminal.hint">terminal</span></button>
  <div class="term" id="termWin" role="dialog" aria-label="Terminal">
    <div class="term__bar"><span class="term__dot term__dot--r"></span><span class="term__dot"></span><span class="term__dot term__dot--g"></span><span class="term__title">guest@portfolio:~ — interactive</span></div>
    <div class="term__out" id="termOut"></div>
    <div class="term__in">
      <span>guest@portfolio:~$</span>
      <input id="termInput" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Terminal input" />
    </div>
  </div>

  <!-- CURSOR -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
